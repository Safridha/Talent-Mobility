services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talent_mobility}
      POSTGRES_USER: ${POSTGRES_USER:-talent_mobility}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      APP_ADDR: 0.0.0.0:8000
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env.docker}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://localhost:8000}"
      RUST_LOG: "${RUST_LOG:-info,tower_http=info}"
      ADMIN_NAME: "${ADMIN_NAME:?Set ADMIN_NAME in .env.docker}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env.docker}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.docker}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
