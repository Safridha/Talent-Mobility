services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talent_mobility_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - talent_mobility_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talent_mobility_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  talent_mobility_dev_data:
